<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Vacante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pantalla">
        <h3>Crear Oferta</h3>
        <form id="form-publicar-vacante" class="formulario">
            <input type="text" id="cargo-vacante" placeholder="Nombre del puesto" required>
            <input type="text" id="pago-vacante" placeholder="Salario" required>
            <input type="text" id="ubicacion-vacante" placeholder="Ciudad / Remoto" required>
            <textarea id="desc-vacante" placeholder="Descripción" required></textarea>
            <button type="submit" class="btn-morado-link">PUBLICAR AHORA</button>
        </form>
        <a href="panel-empresa.html">Volver</a>
    </main>
    <script src="app.js"></script>
</body>
</html>
